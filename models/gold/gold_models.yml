version: 2

models:
  - name: idle_aggregate
    description: Daily idle, movement, engine, fuel, and service-assignment metrics at the vehicle and driver-assignment grain. Incremental runs recompute the most recent 10 days to incorporate late telemetry.
    columns:
      - name: idle_aggregate_id
        description: Null-safe surrogate key for the daily vehicle and service-assignment grain.
      - name: date
        description: Calendar date of the telemetry segment end time.
        data_tests:
          - not_null
      - name: vehicle_number
        description: Vehicle number associated with the telemetry segment.
      - name: engine_hours
        description: Total engine runtime in hours.
      - name: move_hours
        description: Total vehicle movement time in hours.
      - name: idle_hours
        description: Total short and long idle time in hours.
      - name: segment_hours
        description: Total valid telemetry segment duration in hours.
      - name: traveled_miles
        description: Total miles traveled across valid telemetry segments.
      - name: idle_fuel
        description: Total validated short and long idle fuel consumption.
      - name: gal_fuel
        description: Total validated fuel consumption.


  - name: gold_late_fees_audit
    description: Audit-ready late-fee advance detail at the latest trip, advance-reason, and fee-timestamp grain for the trailing 24 months.
    columns:
      - name: late_fee_audit_id
        description: Null-safe surrogate key for the deduplicated late-fee audit record.
        data_tests:
          - not_null
          - unique
      - name: trip_num
        description: Trimmed order or trip number associated with the advance.
        data_tests:
          - not_null
      - name: stop_num
        description: Stop number associated with the advance.
      - name: advance_reason
        description: Normalized advance event reason.
        data_tests:
          - not_null
      - name: fee_amount
        description: Amount of the recorded advance fee.
      - name: fee_datetime
        description: Timestamp of the latest advance record retained for the trip and reason.
      - name: late_fee_approval
        description: Approval status parsed from the latest customer-contact comment.
      - name: bill_pay_approval
        description: Approval status derived from billing and customer-approval records.
