version: 2

models:
  - name: silver_order
    description: >
      One record per source order from iesfilec.order. This view preserves the

      operational order grain and translates source field names into business-facing snake_case
      columns. Julian date fields use the YYYYDDD format and time fields use HHMI; paired values are
      converted into timezone-free Gregorian TIMESTAMP_NTZ columns. A source date of 0 or blank time
      produces a null derived datetime. Write timestamps are null when the source audit value is blank.

    columns:
      - name: order_number
        description: Source order identifier.
        data_tests:
          - not_null
          - unique
      - name: order_status
        description: Current operational status of the order.
      - name: order_date
        description: Raw source order date in Julian YYYYDDD format.
      - name: order_time
        description: Raw source order time in HHMI format.
      - name: order_datetime
        description: Gregorian timestamp created from order_date and order_time.
      - name: shipper
        description: Shipper associated with the order.
      - name: customer
        description: Customer or consignee associated with the order.
      - name: bill_to
        description: Party responsible for billing.
      - name: commodity_code
        description: Code identifying the shipped commodity.
      - name: commodity_description
        description: Description of the shipped commodity.
      - name: order_weight
        description: Recorded weight of the order.
      - name: number_of_pieces
        description: Number of pieces on the order.
      - name: origin_city
        description: Origin city for the order.
      - name: origin_state
        description: Origin state for the order.
      - name: origin_zone
        description: Origin zone for the order.
      - name: origin_region
        description: Origin region for the order.
      - name: destination_city
        description: Destination city for the order.
      - name: destination_state
        description: Destination state for the order.
      - name: destination_zone
        description: Destination zone for the order.
      - name: destination_region
        description: Destination region for the order.
      - name: miles
        description: Total miles for the order.
      - name: loaded_miles
        description: Miles traveled while loaded.
      - name: empty_miles
        description: Miles traveled while empty.
      - name: early_pickup_date
        description: Raw early pickup date in Julian YYYYDDD format.
      - name: early_pickup_time
        description: Raw early pickup time in HHMI format.
      - name: early_pickup_datetime
        description: Gregorian timestamp created from early_pickup_date and early_pickup_time.
      - name: early_delivery_date
        description: Raw early delivery date in Julian YYYYDDD format.
      - name: early_delivery_time
        description: Raw early delivery time in HHMI format.
      - name: early_delivery_datetime
        description: Gregorian timestamp created from early_delivery_date and early_delivery_time.
      - name: late_pickup_date
        description: Raw late pickup date in Julian YYYYDDD format.
      - name: late_pickup_time
        description: Raw late pickup time in HHMI format.
      - name: late_pickup_datetime
        description: Gregorian timestamp created from late_pickup_date and late_pickup_time.
      - name: late_delivery_date
        description: Raw late delivery date in Julian YYYYDDD format.
      - name: late_delivery_time
        description: Raw late delivery time in HHMI format.
      - name: late_delivery_datetime
        description: Gregorian timestamp created from late_delivery_date and late_delivery_time.
      - name: ship_date
        description: Raw ship date in Julian YYYYDDD format.
      - name: ship_time
        description: Raw ship time in HHMI format.
      - name: ship_datetime
        description: Gregorian timestamp created from ship_date and ship_time.
      - name: last_update_date
        description: Raw source update date in Julian YYYYDDD format.
      - name: last_update_time
        description: Raw source update time in HHMI format.
      - name: last_update_datetime
        description: Gregorian timestamp created from last_update_date and last_update_time.
      - name: write_timestamp
        description: Source record write timestamp, parsed from the source audit string. Null when the source value is blank or malformed.
      - name: writer_user_id
        description: User identifier that wrote the source record.
      - name: update_timestamp
        description: Source record update timestamp, parsed from the source audit string.
      - name: update_user_id
        description: User identifier that last updated the source record.
      - name: company_number
        description: Company number associated with the order.
      - name: division_number
        description: Division number associated with the order.
      - name: terminal_number
        description: Terminal number associated with the order.
      - name: future_use_datetime
        description: Gregorian timestamp created from the future-use Julian date and HHMI time fields.
      - name: filler_future_use_datetime
        description: Gregorian timestamp created from the filler future-use Julian date and HHMI time fields.



  - name: silver_stopoff
    description: >
      One record per source stopoff from iesfilec.stopoff. This view preserves the
      operational stop grain and translates source fields into business-facing snake_case columns.
      Julian YYYYDDD date fields paired with HHMI times are converted to timezone-free
      TIMESTAMP_NTZ values; a source date of 0 or blank time produces a null derived timestamp.
    columns:
      - name: order_number
        description: Source order identifier associated with the stop.
      - name: stop_number
        description: Sequence number of the stop within the order.
      - name: stop_type
        description: Source type code for the stop.
      - name: stop_status
        description: Current operational status of the stop.
      - name: customer_code
        description: Customer code associated with the stop.
      - name: early_appointment_datetime
        description: Gregorian timestamp created from the early appointment date and time.
      - name: appointment_datetime
        description: Gregorian timestamp created from the appointment date and time.
      - name: arrival_datetime
        description: Gregorian timestamp created from the arrival date and time.
      - name: load_unload_datetime
        description: Gregorian timestamp created from the load/unload date and time.
      - name: stop_weight
        description: Recorded weight associated with the stop.
      - name: number_of_pieces
        description: Number of pieces associated with the stop.
      - name: write_timestamp
        description: Source record write timestamp, parsed from the source audit string.
      - name: update_timestamp
        description: Source record update timestamp, parsed from the source audit string.



  - name: silver_billing
    description: Source-aligned billing detail from iesfilec.billing. Documented source columns are exposed with normalized comment-based aliases, alongside parsed write and update timestamps.
    columns:
      - name: write_timestamp
        description: Timestamp parsed from the source BI_WTIMS audit field.
      - name: update_timestamp
        description: Timestamp parsed from the source BI_UTIMS audit field.

  - name: silver_cccfilec_unitsrv
    description: Current unit-service detail from cccfilec.unitsrv, with documented source-column aliases and derived Julian date and timestamp fields.
    columns:
      - name: service_date
        description: Gregorian calendar date derived from the source Julian service date.
      - name: trip_movement_datetime
        description: Timestamp derived from the source trip movement Julian date and time.
      - name: estimated_arrival_datetime
        description: Timestamp derived from the source estimated-arrival Julian date and time.
      - name: projected_available_datetime
        description: Timestamp derived from the source projected-availability Julian date and time.
      - name: contact_datetime
        description: Timestamp derived from the source contact Julian date and time.

  - name: silver_cccfilet_unitsrv
    description: Historical unit-service detail from cccfilet.unitsrv, with documented source-column aliases and derived Julian date and timestamp fields.
    columns:
      - name: service_date
        description: Gregorian calendar date derived from the source Julian service date.
      - name: trip_movement_datetime
        description: Timestamp derived from the source trip movement Julian date and time.
      - name: estimated_arrival_datetime
        description: Timestamp derived from the source estimated-arrival Julian date and time.
      - name: projected_available_datetime
        description: Timestamp derived from the source projected-availability Julian date and time.
      - name: contact_datetime
        description: Timestamp derived from the source contact Julian date and time.

  - name: silver_cities
    description: Source-aligned city reference data from iesfilec.cities. Source column names are retained because the Snowflake source has no column comments.

  - name: silver_comment
    description: Operational order comments from iesfilec.comment. Documented source columns use normalized aliases, with derived operational and audit timestamps.
    columns:
      - name: comment_date
        description: Gregorian calendar date derived from the source comment Julian date.
      - name: created_datetime
        description: Timestamp derived from the source comment create date and time.
      - name: changed_datetime
        description: Timestamp derived from the source comment change date and time.
      - name: write_timestamp
        description: Timestamp parsed from the source OC_WTIMS audit field.
      - name: update_timestamp
        description: Timestamp parsed from the source OC_UTIMS audit field.

  - name: silver_custmast
    description: Customer-master detail from iesfilec.custmast, with documented source-column aliases, derived Julian dates, and parsed audit timestamps.
    columns:
      - name: last_update_datetime
        description: Timestamp derived from the source last-update Julian date and time.
      - name: contract_date
        description: Gregorian calendar date derived from the source contract date.
      - name: contract_mailed_date
        description: Gregorian calendar date derived from the source contract-mail date.
      - name: contract_signed_date
        description: Gregorian calendar date derived from the source contract-sign date.
      - name: write_timestamp
        description: Timestamp parsed from the source CU_WTIMS audit field.
      - name: update_timestamp
        description: Timestamp parsed from the source CU_UTIMS audit field.

  - name: silver_dim_date
    description: Date dimension from dbo.dim_date. Source column names are retained because the Snowflake source has no column comments.

  - name: silver_dim_time
    description: Time dimension from dbo.dim_time. Source column names are retained because the Snowflake source has no column comments.

  - name: silver_late_fees_billing
    description: Legacy late-fee billing detail from dbo.late_fees_billing. Source column names are retained because the Snowflake source has no column comments.

  - name: silver_op0131sch
    description: Schedule-assignment detail from cccfilec.op0131sch, with documented source-column aliases normalized to snake_case.

  - name: silver_op0516aa
    description: Advance-record detail from cccfilec.op0516aa, with documented source-column aliases and a derived advance timestamp.
    columns:
      - name: advance_datetime
        description: Timestamp derived from the source advance Julian date and time.

  - name: silver_op0568flt
    description: User-filter detail from cccfilec.op0568flt, with documented source-column aliases normalized to snake_case.

  - name: silver_op0568trp
    description: Trip-dispatch detail from cccfilec.op0568trp, with documented source-column aliases normalized to snake_case.

  - name: silver_op0710bp
    description: Bill-pay detail from cccfilec.op0710bp, with documented source-column aliases and derived Gregorian date fields.
    columns:
      - name: event_date_gregorian
        description: Gregorian calendar date derived from the source event Julian date.
      - name: date_from_gregorian
        description: Gregorian calendar date derived from the source effective-start Julian date.
      - name: date_to_gregorian
        description: Gregorian calendar date derived from the source effective-end Julian date.

  - name: silver_performxbydriverdata
    description: Driver-performance detail from peoplenet.performxbydriverdata. Source column names are retained because the Snowflake source has no column comments.

  - name: silver_units
    description: Unit-master detail from iesfilec.units, with documented source-column aliases, derived Julian dates, and parsed audit timestamps.
    columns:
      - name: termination_date
        description: Gregorian calendar date derived from the source termination Julian date.
      - name: hire_date
        description: Gregorian calendar date derived from the source hire Julian date.
      - name: estimated_arrival_datetime
        description: Timestamp derived from the source estimated-arrival Julian date and time.
      - name: projected_available_datetime
        description: Timestamp derived from the source projected-availability Julian date and time.
      - name: write_timestamp
        description: Timestamp parsed from the source U1_WTIMS audit field.
      - name: update_timestamp
        description: Timestamp parsed from the source U1_UTIMS audit field.
